name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC = 10 PM EST / 9 PM CST
  workflow_dispatch:      # allow manual trigger too

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for commits since last nightly
        id: check
        run: |
          git fetch --tags
          VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          LAST_NIGHTLY=$(git tag --sort=-version:refname | grep "^NIGHTLY-${VERSION}-" | head -n 1)
          if [ -z "$LAST_NIGHTLY" ]; then
            echo "No previous nightly for version $VERSION, proceeding"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git log ${LAST_NIGHTLY}..HEAD --oneline | wc -l)
            echo "Commits since last nightly: $CHANGES"
            if [ "$CHANGES" -eq 0 ]; then
              echo "No changes since last nightly, skipping"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          fi

  build-macos-native:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: macos-cargo-${{ hashFiles('src/native/Cargo.toml', 'src/native/Cargo.lock', 'src/native/src/**') }}
          restore-keys: macos-cargo-

      - name: Build dylib (x86_64)
        working-directory: src/native
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build dylib (aarch64 / Apple Silicon)
        working-directory: src/native
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal (fat) dylib
        working-directory: src/native
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/libtts_native.dylib \
            target/aarch64-apple-darwin/release/libtts_native.dylib \
            -output libtts_native.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-nightly
          path: src/native/libtts_native.dylib
          if-no-files-found: error

  build-mod-jar:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.get_version.outputs.mod_version }}
      nightly_number: ${{ steps.get_nightly_num.outputs.nightly_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: linux-cargo-${{ hashFiles('src/native/Cargo.toml', 'src/native/Cargo.lock', 'src/native/src/**') }}
          restore-keys: linux-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Get mod version
        id: get_version
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get nightly increment
        id: get_nightly_num
        run: |
          git fetch --tags
          VERSION="${{ steps.get_version.outputs.mod_version }}"
          # Count nightlies for this specific version only
          COUNT=$(git tag | grep "^NIGHTLY-${VERSION}-" | wc -l)
          NEXT=$((COUNT + 1))
          echo "nightly_number=$NEXT" >> $GITHUB_OUTPUT

      - name: Build Linux + Windows natives + mod jar
        run: ./gradlew copyNative_x86_64_unknown_linux_gnu copyNative_x86_64_pc_windows_gnu jarJar --no-daemon
        env:
          CARGO_HOME: /home/runner/.cargo
          RUSTUP_HOME: /home/runner/.rustup

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-nightly
          path: build/reobfJarJar/output.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [ build-macos-native, build-mod-jar ]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mod jar
        uses: actions/download-artifact@v4
        with:
          name: mod-jar-nightly
          path: release/

      - name: Download macOS dylib
        uses: actions/download-artifact@v4
        with:
          name: macos-native-nightly
          path: release/macos-native/

      - name: Inject macOS dylib into jar
        run: |
          mkdir -p inject/natives/macos
          cp release/macos-native/libtts_native.dylib inject/natives/macos/
          JAR=release/output.jar
          cd inject
          jar uf "../$JAR" natives/macos/libtts_native.dylib
          cd ..
          echo "JAR_PATH=$JAR" >> $GITHUB_ENV

      - name: Get commits since last nightly
        id: changelog
        run: |
          git fetch --tags
          VERSION="${{ needs.build-mod-jar.outputs.mod_version }}"
          LAST_NIGHTLY=$(git tag --sort=-version:refname | grep "^NIGHTLY-${VERSION}-" | head -n 1)
          if [ -z "$LAST_NIGHTLY" ]; then
            LOG=$(git log --oneline -20)
          else
            LOG=$(git log ${LAST_NIGHTLY}..HEAD --oneline)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create nightly tag
        run: |
          TAG="NIGHTLY-${{ needs.build-mod-jar.outputs.mod_version }}-${{ needs.build-mod-jar.outputs.nightly_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "NIGHTLY_TAG=$TAG" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NIGHTLY_TAG }}
          name: "TTS Nightly — ${{ needs.build-mod-jar.outputs.mod_version }} #${{ needs.build-mod-jar.outputs.nightly_number }}"
          prerelease: true
          body: |
            ## Nightly Build
            > ⚠️ This is an automated nightly build. It may be unstable or broken.

            **Mod version:** `${{ needs.build-mod-jar.outputs.mod_version }}`
            **Nightly:** `#${{ needs.build-mod-jar.outputs.nightly_number }}`

            ### Changes since last nightly
            ${{ steps.changelog.outputs.changelog }}
            ### Platforms
            - Windows (x86_64)
            - Linux (x86_64)
            - macOS (x86_64 Intel + aarch64 Apple Silicon — universal binary)

          files: ${{ env.JAR_PATH }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}