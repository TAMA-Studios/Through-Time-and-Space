name: Build macOS Native + Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-native:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: macos-cargo-${{ hashFiles('src/native/Cargo.toml', 'src/native/Cargo.lock', 'src/native/src/**') }}
          restore-keys: macos-cargo-

      - name: Build dylib (x86_64)
        working-directory: src/native
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build dylib (aarch64 / Apple Silicon)
        working-directory: src/native
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal (fat) dylib
        working-directory: src/native
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/libtts_native.dylib \
            target/aarch64-apple-darwin/release/libtts_native.dylib \
            -output libtts_native.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-native
          path: src/native/libtts_native.dylib
          if-no-files-found: error


  build-mod-jar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: linux-cargo-${{ hashFiles('src/native/Cargo.toml', 'src/native/Cargo.lock', 'src/native/src/**') }}
          restore-keys: linux-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Linux + Windows natives + mod jar
        run: ./gradlew copyNative_x86_64_unknown_linux_gnu copyNative_x86_64_pc_windows_gnu jarJar --no-daemon
        env:
          CARGO_HOME: /home/runner/.cargo
          RUSTUP_HOME: /home/runner/.rustup

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/reobfJarJar/output.jar
          if-no-files-found: error


  release:
    runs-on: ubuntu-latest
    needs:
      - build-macos-native
      - build-mod-jar

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mod jar
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: release/

      - name: Download macOS dylib
        uses: actions/download-artifact@v4
        with:
          name: macos-native
          path: release/macos-native/

      - name: Inject macOS dylib into jar
        run: |
          mkdir -p inject/natives/macos

          cp \
            release/macos-native/libtts_native.dylib \
            inject/natives/macos/libtts_native.dylib

          JAR="release/output.jar"

          echo "Patching: $JAR"

          cd inject
          jar uf "../$JAR" natives/macos/libtts_native.dylib
          cd ..

          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "Using existing tag: $TAG"
          else
            TAG="v0.0.0-dev.$(date -u +'%Y%m%d.%H%M%S')"
            echo "Generated development tag: $TAG"
          fi

          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get previous tag
        id: prev_tag
        run: |
          CURRENT="${{ steps.tag.outputs.TAG }}"

          git fetch --tags --force

          PREV=$(
            git tag --sort=-version:refname \
              | grep -v "^${CURRENT}$" \
              | head -n 1
          )

          echo "Previous tag: $PREV"
          echo "PREV_TAG=$PREV" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: "TTS ${{ steps.tag.outputs.TAG }}

          body: |
            ## Through Time and Space ${{ steps.tag.outputs.TAG }}

            Built automatically from commit `${{ github.sha }}`.

            ### Platforms
            - Windows (x86_64)
            - Linux (x86_64)
            - macOS (x86_64 Intel + aarch64 Apple Silicon)

            ### Installation
            Drop the jar into your `mods/` folder.

            ### NOTICE
            This mod was designed and built against Forge 47.1.3 for Minecraft 1.20.1. Other versions of Minecraft/Forge MAY work but are not guaranteed to do so. If you're encountering an issue with the mod, first make sure you're on a supported version of Forge and Minecraft. If you are on, say, Minecraft 1.20.4, or Forge 47.4.20, support may be limited.

            **Full Changelog**: https://github.com/TAMA-Studios/Through-Time-and-Space/compare/${{ steps.prev_tag.outputs.PREV_TAG }}...${{ steps.tag.outputs.TAG }}

          files: ${{ env.JAR_PATH }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
