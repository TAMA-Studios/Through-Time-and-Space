title: "Through Time and Space Wiki"

baseURL: "https://tama-studios.github.io/Through-Time-and-Space/"
languageCode: "en-us"
defaultContentLanguage: "en"

enableRobotsTXT: true
enableGitInfo: true

module:
  imports:
    - path: github.com/alex-shpak/hugo-book

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  BookTheme: auto
  BookToC: true
  BookSection: docs
  BookSearch: true
  BookComments: false
  BookPortableLinks: false
  BookServiceWorker: false

  BookRepo: "https://github.com/TAMA-Studios/Through-Time-and-Space"
  BookCommitPath: "commit"
  BookEditPath: "edit/Wiki"