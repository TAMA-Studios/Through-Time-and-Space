title: Through Time and Space Wiki
baseURL: 'https://tama-studios.github.io/'
enableRobotsTXT: true
enableGitInfo: true
defaultContentLanguage: en

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  author:
    name: "TAMA Studios"
    email: "codiak540@4d2.org"
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  editURL:
    base: "https://tama-studios.github.io/Through-Time-and-Space/edit/main/content/"

menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
    - name: GitHub
      url: "https://tama-studios.github.io/Through-Time-and-Space/"
      weight: 2
      params:
        icon: github