buildscript {
	repositories {
		maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
		mavenCentral()
	}
	dependencies {
	}
}

plugins {
	id 'idea'
	id("com.diffplug.spotless") version "7.0.4"
	id "io.freefair.lombok" version "8.12.2.1"
	id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
	id 'org.jetbrains.kotlin.jvm' version '1.9.0'
	id 'org.spongepowered.mixin' version '0.7.+'
	id 'jacoco'
	id 'com.gradleup.shadow' version '8.3.0'
}

jacoco {
	toolVersion = "0.8.11"
}

jacocoTestReport {
	reports {
		xml.required = true
		html.required = true
	}
}

configurations {
	commonShadow
	implementation.extendsFrom(commonShadow)
	runtimeOnly.extendsFrom(commonShadow)
}

group = mod_group_id
version = mod_version

base {
	archivesName = mod_id
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
	mappings channel: mapping_channel, version: mapping_version

	copyIdeResources = true

	// Access Transformer
	accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

	runs {
		configureEach {
			workingDirectory project.file('run')

			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'

			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}

		build {
			jvmArg("-Xlint:deprecation")
		}

		client {
			property 'forge.enabledGameTestNamespaces', mod_id
			workingDirectory project.file('run')
			if (project.hasProperty('enableEnhancedClassRedefinition')) {
				jvmArg "-XX:+AllowEnhancedClassRedefinition"
			}
			jvmArg "-Dmixin.hotSwap=true"
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			property 'forge.enabledGameTestNamespaces', 'tts'
			arg "-mixin.config=mixins.tts.json"
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

			mods {
				tts {
					source sourceSets.main
				}
			}
		}

		server {
			property 'forge.enabledGameTestNamespaces', mod_id
			args '--nogui'
		}

		gameTestServer {
			property 'forge.enabledGameTestNamespaces', mod_id
		}

		data {
			workingDirectory project.file('run-data')

			args '--mod', mod_id,
					'--all',
					'--output', file('src/generated/resources/'),
					'--existing', file('src/main/resources/')
		}
	}
}

mixin {
	add sourceSets.main, "mixins.${mod_id}.refmap.json"

	config "mixins.${mod_id}.json"

	debug.verbose = true
	debug.export = true
	dumpTargetOnFailure = true
}

// Include resources generated by data generators.
sourceSets.main.resources {
	srcDir 'src/generated/resources'
}

repositories {

	maven {
		// Registrate
		url "https://maven.tterrag.com/"
	}

	maven {
		url "https://cursemaven.com"
	}

	flatDir {
		dir 'libs'
	}

	maven {
		url = "https://repo.maven.apache.org/maven2/"
	}

	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}

	maven {
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}

	maven {
		url = "https://maven.createmod.net"
	}

	maven {
		url "https://maven.squiddev.cc"

		content {
			includeGroup("cc.tweaked")
		}
	}
}

dependencies {

	// Flywheel
	compileOnly fg.deobf(
			"dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:1.0.5-264"
	)

	runtimeOnly fg.deobf(
			"dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:1.0.5-264"
	)

	jarJar(
			"dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:[1.0.5-264, 2)"
	) {
		jarJar.pin(it, "1.0.5-264")
	}

	// Ponder
	compileOnly(
			fg.deobf(
					"net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
			)
	)

	runtimeOnly(
			fg.deobf(
					"net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
			)
	)

	jarJar(
			"net.createmod.ponder:Ponder-Forge-${minecraft_version}:[${ponder_version},)"
	) {
		jarJar.pin(it, ponder_version)
	}

	// Mixin Extras
	compileOnly(
			annotationProcessor(
					"io.github.llamalad7:mixinextras-common:0.5.0"
			)
	)

	// Registrate
	implementation fg.deobf(
			"com.tterrag.registrate:Registrate:${registrate_version}"
	)

	jarJar(
			"com.tterrag.registrate:Registrate:${registrate_version}"
	) {
		jarJar.pin(it, registrate_version)
	}

	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"

	implementation(
			jarJar("io.github.llamalad7:mixinextras-forge:0.5.0")
	) {
		jarJar.ranged(it, "[0.5.0,)")
	}

	implementation(
			jarJar("org.luaj:luaj-jse:3.0.1")
	) {
		jarJar.ranged(it, "[3.0.1,)")
	}

	// Minecraft
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	// Building Gadgets
	implementation fg.deobf(
			"curse.maven:building-gadgets-298187:5144161"
	)

	// Worldedit
	implementation fg.deobf(
			"curse.maven:worldedit-225608:4586218"
	)

	// Computercraft
	compileOnly fg.deobf(
			"cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cctVersion}"
	)

	compileOnly fg.deobf(
			"cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cctVersion}"
	)

	runtimeOnly(fg.deobf(
			"cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cctVersion}"
	))

	runtimeOnly(fg.deobf(
			"cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cctVersion}"
	))

	// Patchouli
	compileOnly(
			fg.deobf(
					"vazkii.patchouli:Patchouli:${patchouliVersion}:api"
			)
	)

	runtimeOnly(
			fg.deobf(
					"vazkii.patchouli:Patchouli:${patchouliVersion}"
			)
	)

	// JEI
	compileOnly(
			fg.deobf(
					"mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
			)
	)

	compileOnly(
			fg.deobf(
					"mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
			)
	)

	runtimeOnly(
			fg.deobf(
					"mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
			)
	)

	// Mekanism
	implementation fg.deobf(
			"curse.maven:mekanism-268560:6552911"
	)

	implementation 'org.openjdk.nashorn:nashorn-core:15.4'

	// Terrablender
	compileOnly(
			fg.deobf(
					"com.github.glitchfiend:TerraBlender-forge:${minecraft_version}-${terrablender_version}"
			)
	)

	implementation fileTree(
			dir: 'libs',
			include: ['*.jar']
	)

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.32'
	annotationProcessor 'org.projectlombok:lombok:1.18.32'

	// Mixin
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


	annotationProcessor project(':mem_manager')
	implementation project(':mem_manager')
}

tasks.register('generateSourcesOnly', JavaCompile) {
	description = 'Runs annotation processors without compiling bytecode.'

	source = sourceSets.main.java
	classpath = sourceSets.main.compileClasspath

	destinationDirectory = layout.buildDirectory.dir(
			'generated/sources/annotationProcessor/java/main'
	)

	options.annotationProcessorPath = configurations.annotationProcessor
	options.compilerArgs += '-proc:only'
}

tasks.named('jarJar', Jar).configure {
	from(sourceSets.main.output)
	rename 'mixins.tts.refmap.json', 'mixins-refmap.tts.json'
}


// ============================================================================
// RUST NATIVE BUILD
// ============================================================================
//
// Select the native build tool/target from the OS Gradle is running on.
// This prevents Linux/macOS builds from trying to invoke `cross` for the
// Windows target before it is needed.
//
// Windows: cross -> x86_64-pc-windows-gnu
// Linux:   cargo -> x86_64-unknown-linux-gnu
// macOS:   cargo -> universal x86_64 + aarch64 dylib
// ============================================================================

def rustBin = findProperty('RUSTC_PATH')
def cargoBin = findProperty('CARGO_PATH')
def crossBin = findProperty('CROSS_PATH')

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def isWindows = osName.contains('win')
def isMac = osName.contains('mac') || osName.contains('darwin')
def isLinux = osName.contains('linux')

def hostOs = isWindows ? 'windows' : isMac ? 'macos' : isLinux ? 'linux' : 'unknown'

if (!rustBin) {
	throw new GradleException(
			"RUSTC_PATH is not defined in gradle.properties"
	)
}

if (!cargoBin) {
	throw new GradleException(
			"CARGO_PATH is not defined in gradle.properties"
	)
}

// CROSS_PATH is only required when actually building the Windows target.
if (isWindows && !crossBin) {
	throw new GradleException(
			"CROSS_PATH is not defined in gradle.properties"
	)
}

def rustcExecutable = "${rustBin}"
def cargoExecutable = "${cargoBin}"
def crossExecutable = crossBin ? "${crossBin}" : null

def rustPath = [
		rustBin,
		cargoBin,
		crossBin ?: '',
		System.getenv('PATH') ?: ''
].join(File.pathSeparator)

def rustupHome = System.getenv('RUSTUP_HOME') ?:
		"${System.getenv('HOME')}/.rustup"

def cargoHome = System.getenv('CARGO_HOME') ?:
		"${System.getenv('HOME')}/.cargo"

println "Rust native build host OS: ${hostOs}"

// Keep all native targets available as explicit Gradle tasks.
def rustTargets = [
		[
				target: 'x86_64-pc-windows-gnu',
				libName: 'tts_native.dll',
				destDir: 'windows',
				tool: 'cross'
		],
		[
				target: 'x86_64-unknown-linux-gnu',
				libName: 'libtts_native.so',
				destDir: 'linux',
				tool: 'cargo'
		]
]

if (!isWindows && !isLinux && !isMac) {
	throw new GradleException(
			"Unsupported host OS: ${System.getProperty('os.name')}"
	)
}

// Only these targets are selected by the normal build lifecycle.
def activeRustTargets = isWindows ?
		rustTargets.findAll { it.target == 'x86_64-pc-windows-gnu' } :
		isLinux ?
				rustTargets.findAll { it.target == 'x86_64-unknown-linux-gnu' } :
				[]

// macOS targets used to create the universal dylib.
def macTargets = [
		[
				target: 'x86_64-apple-darwin',
				libName: 'libtts_native.dylib',
				tool: 'cargo'
		],
		[
				target: 'aarch64-apple-darwin',
				libName: 'libtts_native.dylib',
				tool: 'cargo'
		]
]


def rustSrcDir = 'src/native'
def nativesOutDir = 'src/main/resources/natives'


// ============================================================================
// Common Rust environment
// ============================================================================

def configureRustEnvironment = { Exec task ->

	// Force the exact rustc we want.
	task.environment 'RUSTC', rustcExecutable

	// Make Rust and Cargo tools available.
	task.environment 'PATH', rustPath

	// Keep cargo/rustup state in the normal ~/.cargo / ~/.rustup locations.
	task.environment 'CARGO_HOME', cargoHome
	task.environment 'RUSTUP_HOME', rustupHome

	// Helpful for build scripts and tools which inspect these.
	task.environment 'RUSTC_PATH', rustBin
}


// ============================================================================
// Rust build tasks
// ============================================================================

def rustBuildTasks = rustTargets.collect { cfg ->

	def safeTarget = cfg.target.replace('-', '_')

	tasks.register(
			"buildRust_${safeTarget}",
			Exec
	) {

		group = 'rust'
		description =
				"Compile Rust -> ${cfg.target}"
		workingDir = rustSrcDir

		def toolBin = cfg.tool == 'cross' ? (crossExecutable ?: 'cross') : cargoExecutable

		commandLine toolBin,
				'build',
				'--release',
				'--target',
				cfg.target

		configureRustEnvironment(delegate)

		inputs.dir "${rustSrcDir}/src"
		inputs.file "${rustSrcDir}/Cargo.toml"

		outputs.file(
				"${rustSrcDir}/target/${cfg.target}/release/${cfg.libName}"
		)

		doFirst {
			println ""
			println "============================================================"
			println "Building Rust target: ${cfg.target}"
			println "Tool:                 ${toolBin}"
			println "RUSTC:                ${rustcExecutable}"
			println "CARGO_HOME:           ${cargoHome}"
			println "PATH:                 ${rustPath}"
			println "============================================================"
			println ""
		}
	}
}


// ============================================================================
// Native copy tasks
// ============================================================================

def rustCopyTasks = [
		rustBuildTasks,
		rustTargets
].transpose().collect { buildTask, cfg ->

	def safeTarget = cfg.target.replace('-', '_')

	tasks.register(
			"copyNative_${safeTarget}",
			Copy
	) {

		group = 'rust'
		description =
				"Copy ${cfg.target} native lib into resources"

		dependsOn buildTask

		from(
				"${rustSrcDir}/target/${cfg.target}/release/${cfg.libName}"
		)

		into(
				"${nativesOutDir}/${cfg.destDir}/"
		)
	}
}


// ============================================================================
// macOS Rust tasks
// ============================================================================

if (isMac) {
	macTargets.each { cfg ->

		def safeTarget = cfg.target.replace('-', '_')

		tasks.register(
				"buildRust_${safeTarget}",
				Exec
		) {

			group = 'rust'
			description =
					"Compile Rust -> ${cfg.target} (macOS only)"
			workingDir = rustSrcDir

			commandLine cargoExecutable,
					'build',
					'--release',
					'--target',
					cfg.target

			configureRustEnvironment(delegate)

			inputs.dir "${rustSrcDir}/src"
			inputs.file "${rustSrcDir}/Cargo.toml"

			outputs.file(
					"${rustSrcDir}/target/${cfg.target}/release/${cfg.libName}"
			)

			doFirst {
				println ""
				println "============================================================"
				println "Building Rust target: ${cfg.target}"
				println "Tool:                 ${cargoExecutable}"
				println "RUSTC:                ${rustcExecutable}"
				println "============================================================"
				println ""
			}
		}
	}

	// ============================================================================
	// macOS universal dylib
	// ============================================================================

	tasks.register('copyNativeMac') {

		group = 'rust'
		description =
				'Build universal macOS dylib and copy into resources. macOS only.'

		dependsOn(
				'buildRust_x86_64_apple_darwin',
				'buildRust_aarch64_apple_darwin'
		)

		doLast {
			def x86Out =
					"${rustSrcDir}/target/x86_64-apple-darwin/release/libtts_native.dylib"
			def armOut =
					"${rustSrcDir}/target/aarch64-apple-darwin/release/libtts_native.dylib"
			def destDir =
					"${nativesOutDir}/macos"
			def fatOut =
					"${destDir}/libtts_native.dylib"

			mkdir destDir

			exec {
				commandLine(
						'lipo',
						x86Out,
						armOut,
						'-output',
						fatOut
				)
			}

			println "Universal macOS dylib written to ${fatOut}"
		}
	}
}


// ============================================================================
// Aggregate Rust tasks
// ============================================================================

tasks.register('buildRust') {

	group = 'rust'
	description =
			"Compile Rust for ${hostOs}"

	dependsOn rustBuildTasks.findAll { task ->
		activeRustTargets.any { cfg ->
			task.name == "buildRust_${cfg.target.replace('-', '_')}"
		}
	}

	if (isMac) {
		dependsOn 'buildRust_x86_64_apple_darwin',
				'buildRust_aarch64_apple_darwin'
	}
}


tasks.register('copyNativeLibs') {

	group = 'rust'
	description =
			"Copy ${hostOs} native libs into resources"

	dependsOn rustCopyTasks.findAll { task ->
		activeRustTargets.any { cfg ->
			task.name == "copyNative_${cfg.target.replace('-', '_')}"
		}
	}

	if (isMac) {
		dependsOn 'copyNativeMac'
	}
}

processResources.dependsOn 'copyNativeLibs'


// ============================================================================
// Shadow JAR
// ============================================================================

shadowJar {
	archiveClassifier.set('shadowed')

	configurations = [
			project.configurations.commonShadow
	]

	from(sourceSets.main.output) {
		include 'mixins-refmap.tts.json'
	}

	// Exclude accidental duplicate refmaps from bundled dependencies/jars
	exclude 'mixins*.refmap.json'
	// Re-include our specifically renamed one from main output
	include 'mixins-refmap.tts.json'

	manifest {
		from(jar.manifest)
	}

	finalizedBy 'reobfShadowJar'
}


// Add reobf task for shadowJar
reobf {
	shadowJar { }
	jarJar { }
}

tasks.jarJar.finalizedBy('reobfJarJar')

tasks.build.dependsOn shadowJar
tasks.build.dependsOn reobfShadowJar


// ============================================================================
// Resource processing
// ============================================================================

tasks.named(
		'processResources',
		ProcessResources
).configure {

	var replaceProperties = [
			minecraft_version:
					minecraft_version,

			minecraft_version_range:
					minecraft_version_range,

			forge_version:
					forge_version,

			forge_version_range:
					forge_version_range,

			loader_version_range:
					loader_version_range,

			mod_id:
					mod_id,

			mod_name:
					mod_name,

			mod_license:
					mod_license,

			mod_version:
					mod_version,

			mod_authors:
					mod_authors,

			mod_description:
					mod_description
	]

	inputs.properties replaceProperties

	filesMatching(
			[
					'META-INF/mods.toml',
					'pack.mcmeta'
			]
	) {

		expand replaceProperties + [
				project: project
		]
	}
}


// ============================================================================
// JAR
// ============================================================================

tasks.named(
		'jar',
		Jar
).configure {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {

		attributes([
				"Specification-Title":
						mod_id,

				"Specification-Vendor":
						mod_authors,

				"Specification-Version":
						"1",

				"Implementation-Title":
						project.name,

				"Implementation-Version":
						project.jar.archiveVersion,

				"Implementation-Vendor":
						mod_authors,

				"Implementation-Timestamp":
						new Date().format(
								"yyyy-MM-dd'T'HH:mm:ssZ"
						)
		])
	}

	rename(
			'mixins.tts.refmap.json',
			'mixins-refmap.tts.json'
	)

	finalizedBy 'reobfJar'
}


// ============================================================================
// General task configuration
// ============================================================================

tasks.withType(ProcessResources).configureEach {
	duplicatesStrategy =
			DuplicatesStrategy.EXCLUDE
}


tasks.withType(JavaCompile).configureEach {

	options.encoding = 'UTF-8'

	options.compilerArgs << "-AoutRefMapFile=${buildDir}/resources/main/mixins.tts.refmap.json"
}


// ============================================================================
// Spotless
// ============================================================================

spotless {

	format 'misc', {

		target(
				'*.gradle',
				'.gitattributes',
				'.gitignore'
		)

		trimTrailingWhitespace()

		leadingSpacesToTabs()
	}

	java {

		removeUnusedImports()

		importOrder(
				'java',
				'javax',
				'',
				'net.minecraft',
				"com.code.tama.triggerapi",
				group
		)

		eclipse()

		trimTrailingWhitespace()

		leadingSpacesToTabs()

		formatAnnotations()

		licenseHeader(
				'/* (C) TAMA Studios $YEAR */'
		)
	}
}